name: Deploy Application

on:
  push:
    branches:
      - '*'

jobs:
  create-deployment-artifact:
    name: Create Deployment Artifact
    runs-on: ubuntu-latest

    # `.env.example` sets CACHE_STORE=redis, matching dev and production: both
    # apps invalidate each other's catalog cache, which only works when they
    # share one store. Pest itself forces the `array` store (phpunit.xml), but
    # the artisan steps below boot the app with the real .env.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer
          extensions: redis

      - name: Install PHP Dependencies
        working-directory: ./admin
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Compile CSS and JavaScript
        working-directory: ./admin
        run: |
          npm ci
          npm run build

      - name: Setup Environment
        working-directory: ./admin
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Pint Test
        working-directory: ./admin
        run: |
          ./vendor/bin/pint --test

      - name: Run Pest Tests
        working-directory: ./admin
        run: |
          ./vendor/bin/pest

      - name: Run PHPStan Analysis
        working-directory: ./admin
        run: |
          ./vendor/bin/phpstan --memory-limit=2048M analyse

  create-deployment-artifact-shop:
    name: Create Deployment Artifact (Shop)
    runs-on: ubuntu-latest

    # The shop reads the admin-owned database, so tests need that schema.
    # We stand up Postgres, build the schema with admin's migrations, then run
    # the shop test suite against it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shop_flow_test
          POSTGRES_USER: shop_flow
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop_flow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # See the admin job: `.env.example` is on CACHE_STORE=redis so a clone
      # matches dev/production, where the two apps share one cache store.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: shop_flow_test
      DB_USERNAME: shop_flow
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer
          extensions: pdo_pgsql, pgsql, redis

      - name: Build shared schema (admin migrations)
        working-directory: ./admin
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class="Database\\Seeders\\SettingSeeder" --force

      - name: Install PHP Dependencies
        working-directory: ./shop
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Compile CSS and JavaScript
        working-directory: ./shop
        run: |
          npm ci
          npm run build

      - name: Run Frontend Lint & Format Check
        working-directory: ./shop
        run: |
          npm run lint
          npm run format:check

      - name: Setup Environment
        working-directory: ./shop
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Pint Test
        working-directory: ./shop
        run: |
          ./vendor/bin/pint --test

      - name: Run Pest Tests
        working-directory: ./shop
        run: |
          ./vendor/bin/pest

      - name: Run PHPStan Analysis
        working-directory: ./shop
        run: |
          ./vendor/bin/phpstan --memory-limit=2048M analyse
