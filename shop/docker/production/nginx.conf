# Storefront web server. TLS and HTTP/2 are handled by the Caddy proxy in front, so
# this only listens on plain 80 inside the Docker network.
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 100M;
    # public/storage is a symlink into the uploads volume.
    disable_symlinks off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml font/woff font/woff2;

    # Vite writes content-hashed filenames, so these can never go stale.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller is allowed to execute.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass shop_app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Anything else ending in .php is not a route — never hand it to PHP.
    location ~ \.php$ {
        return 404;
    }

    # Dotfiles are not web content.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
