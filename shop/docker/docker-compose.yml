# Service names are prefixed because the root compose.yaml merges this file
# with admin/ and infrastructure/ into one project, where a duplicate service
# name would silently override the other definition.
#
# Container names use SHOP_CONTAINER_PREFIX rather than COMPOSE_PROJECT_NAME:
# the latter is reserved, so under the root project it would resolve to
# shop_flow for this file and admin/ alike and the two would collide.
services:
    shop_app:
        build:
            args:
                gid: ${GROUP_ID}
                uid: ${USER_ID}
            context: ./
            dockerfile: Dockerfile
        image: shop_website
        container_name: "${SHOP_CONTAINER_PREFIX:-shop_flow_shop}_app"
        restart: unless-stopped
        volumes:
            - ../../:/var/www/html
        networks:
            - net

    shop_nginx:
        image: nginx:alpine3.19
        container_name: "${SHOP_CONTAINER_PREFIX:-shop_flow_shop}_nginx"
        restart: unless-stopped
        depends_on:
            - shop_app
        ports:
            - "127.0.0.1:${NGINX_EXPOSE_PORT}:80"
        volumes:
            - ../../:/var/www/html
            - ./volumes/nginx:/etc/nginx/conf.d/
        networks:
            - net

networks:
    net:
      name: shop_flow_net
      external: true
