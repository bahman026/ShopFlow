services:

    db:
        image: postgres:16-alpine
        container_name: ${COMPOSE_PROJECT_NAME}_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USERNAME}
        volumes:
            - ./volumes/postgres/data:/var/lib/postgresql/data
        ports:
            - 127.0.0.1:${POSTGRES_EXPOSE_PORT}:5432
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 30s
        networks:
            - net

    redis:
        image: redis:alpine
        container_name: ${COMPOSE_PROJECT_NAME}_redis
        restart: always
        ports:
            - 127.0.0.1:${REDIS_EXPOSE_PORT}:6379
        command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        volumes:
            - ./volumes/redis:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep -q PONG"]
            interval: 5s
            timeout: 5s
            retries: 12
        networks:
            - net

# The explicit `name` pins the real network to shop_flow_net no matter which
# project creates it, so admin/ and shop/ can join it as an external network.
networks:
    net:
        name: shop_flow_net
        driver: bridge
