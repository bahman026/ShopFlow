; Overrides the stock www pool. Baked into /usr/local/etc/php-fpm.d/.
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
; Roughly (available RAM for PHP) / (peak memory per request). Raise together
; with the VPS size; every worker can use up to php.ini's memory_limit.
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers to cap the damage from any slow leak.
pm.max_requests = 500

; Keep the environment passed in by Compose. php-fpm clears it by default,
; which would hide every value in the app's env_file from PHP.
clear_env = no

; Send everything to the container's stdout/stderr for `docker compose logs`.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Log a stack trace for anything slower than this instead of guessing later.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
request_terminate_timeout = 60s
