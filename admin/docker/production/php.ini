; Production PHP settings. Baked into the image at /usr/local/etc/php/conf.d/.

; --- OPcache ---------------------------------------------------------------
; The image is immutable, so timestamp validation is pure overhead: code only
; changes when a new image is deployed, and that restarts the container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
; Filament pulls in a lot of classes; the 10000 default is not enough.
opcache.max_accelerated_files = 30000
; Attributes are read via reflection, so doc comments must be kept.
opcache.save_comments = 1
opcache.fast_shutdown = 1

; JIT gives little for a request/response workload and is the least battle-worn
; part of OPcache. Enable deliberately, after benchmarking:
;   opcache.jit = tracing
;   opcache.jit_buffer_size = 128M
opcache.jit = disable

; --- realpath cache --------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- limits ----------------------------------------------------------------
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 100M
post_max_size = 100M

; --- hardening -------------------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; Docker collects stderr, so no log file to rotate.
error_log = /proc/self/fd/2
